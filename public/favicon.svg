<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ngBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28683D"/>
      <stop offset="100%" stop-color="#143B20"/>
    </linearGradient>
    <linearGradient id="ngLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E8C34"/>
      <stop offset="100%" stop-color="#7EC049"/>
    </linearGradient>
    <linearGradient id="ngGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5CE68"/>
      <stop offset="100%" stop-color="#D49925"/>
    </linearGradient>
    <filter id="ngGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#07190D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Badge in Forest Green with Warm Gold Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ngBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#E8B84A" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Grocery Bag / Basket Arch base contour -->
  <path d="M19 45.5C21 49 26 51 32 51C38 51 43 49 45 45.5" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sprout Secondary Leaf (Left) -->
  <path d="M31 38C22 36 17 27 18 19C26 20 29 29 31 38Z" fill="#9DD866" filter="url(#ngGlow)"/>
  <path d="M31 38C27 30 23 25 18 19" stroke="#EBF8D8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Main Fresh Leaf (Right) -->
  <path d="M32 46C30 36 34 22 47 16C47 28 42 41 32 46Z" fill="url(#ngLeaf)" filter="url(#ngGlow)"/>
  <!-- Leaf Central Vein -->
  <path d="M32 46C34.5 35 39 26 47 16" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Turmeric Gold Harvest Sun / Organic Seed Crown -->
  <circle cx="45" cy="14" r="3.5" fill="url(#ngGold)"/>
  <circle cx="45" cy="14" r="1.5" fill="#FFF8DE"/>

  <!-- Small Village Golden Sparkle -->
  <circle cx="19" cy="17" r="1.5" fill="#F5CE68" opacity="0.9"/>
</svg>
